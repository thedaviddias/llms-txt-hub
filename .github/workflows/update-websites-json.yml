name: Update websites.json

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "packages/content/data/websites/**"
      - "scripts/generate-websites.ts"
      - "scripts/search-index-generator.cjs"

concurrency:
  group: update-websites-json-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-websites-json:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: read

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          # The main ruleset requires pull requests and only repository admins can
          # bypass it, so pushes use an admin PAT instead of GITHUB_TOKEN.
          token: ${{ secrets.PAT_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/install

      - name: Generate websites.json and search index
        run: |
          pnpm generate-websites
          pnpm generate-search-index

      - name: Commit and push generated files
        run: |
          files="data/websites.json apps/web/public/search/search-index.json"
          if git diff --quiet -- $files; then
            echo "Generated files are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $files
          # [skip ci] keeps this commit from triggering Routed CI; the site builds its own index
          git commit -m "chore: update websites.json [skip ci]"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; rebasing onto the latest main."
            git pull --rebase origin main
          done

          echo "::error::Could not push generated files to main. Check that PAT_TOKEN belongs to a repository admin with contents write access."
          exit 1
